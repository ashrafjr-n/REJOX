name: CI

# Runs on every push and PR to master. The point is the one thing this repo has
# already failed at once: a red test sitting unnoticed on the main branch.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A new push supersedes an in-flight run for the same ref — except on master,
# where every commit's result is worth having.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  # Both refusals are opted out of deliberately: CI binds nothing to a network
  # and migrates only fixtures from this repo. Never a production posture.
  REJOX_ALLOW_ANONYMOUS: "1"
  REJOX_ALLOW_UNSANDBOXED: "1"
  # No network, no key, deterministic: the offline provider makes the one
  # navigator-shape call so a run is byte-reproducible.
  REJOX_AI_PROVIDER: fake

jobs:
  # The gate: everything except the tests that npm-install and run Metro, and
  # the containment gates that need a live daemon (both have their own job).
  # ~5 minutes against ~13 for the whole suite — most of that is the Node
  # parser/codemod workers, which nearly every test genuinely exercises, so this
  # split buys less than the marker name suggests. It is still the difference
  # between a PR verdict inside a coffee break and one after a quarter of an hour.
  backend:
    name: Backend (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The shared rate-limit gate (C2) asserts against a real Redis and skips
    # itself where none answers. Without this it would skip on every CI run —
    # a green tick for a test that never executed.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # The Project Intelligence Engine and the Deterministic Transformer are
      # Node workers, so the "Python" job needs Node to run at all.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/parser-worker/package-lock.json
            backend/codemod-worker/package-lock.json

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Build the Node workers
        working-directory: backend
        run: |
          for worker in parser-worker codemod-worker; do
            (cd "$worker" && npm ci --no-audit --no-fund && npm run build)
          done

      # `sandbox_live` is deselected here, not skipped: it needs a daemon, and a
      # red containment gate deserves its own job name rather than being one
      # line in a 300-test run. It is the `containment` job below.
      - name: Test
        working-directory: backend
        run: pytest -q -m "not slow and not sandbox_live"

  # The real thing: emit → npm install → tsc → Metro on the benchmark app.
  # Slow and network-bound, so it does not gate a PR's first feedback — but it
  # does have to pass before anything lands.
  integration:
    name: Backend (integration — npm + tsc + Metro)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/parser-worker/package-lock.json
            backend/codemod-worker/package-lock.json

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Build the Node workers
        working-directory: backend
        run: |
          for worker in parser-worker codemod-worker; do
            (cd "$worker" && npm ci --no-audit --no-fund && npm run build)
          done

      - name: Test (slow)
        working-directory: backend
        run: pytest -q -m slow

  # Section A of docs/PRE-LAUNCH-CHECKLIST.md, against the runner's own daemon.
  # Until this existed, every containment claim in docs/SECURITY.md rested on
  # unit tests of the `docker run` argv — which prove the flags were *passed*,
  # never that they took effect. Notably: this job does NOT set
  # REJOX_ALLOW_UNSANDBOXED, unlike every other job here.
  containment:
    name: Containment (live daemon — section A)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REJOX_SANDBOX: docker
      # Emptied, not omitted: the workflow-level env above sets these for every
      # job, and a job that claims to assert containment while inheriting the
      # opt-out would be asserting nothing.
      REJOX_ALLOW_UNSANDBOXED: ""
      REJOX_ALLOW_ANONYMOUS: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      # Fail loudly rather than letting the suite skip itself green: these tests
      # skip where no daemon answers, which is right on a laptop and worthless
      # in CI.
      - name: The runner really has a daemon
        run: docker version --format 'server {{.Server.Version}}'

      - name: Containment gates
        working-directory: backend
        run: pytest -q -m sandbox_live

  # Sections B and C: the deployment as it is actually shipped. The job above
  # runs as a process ON the host, so every path it hands the daemon is one the
  # daemon already shares — the sibling-container mount mismatch cannot happen
  # there. Here the worker is a container asking the host's daemon for a sandbox,
  # which is the geometry that shipped broken and was only caught by running it.
  # It also carries the two HTTP gates that need a real deployment rather than a
  # test client: run ownership across two identities (C3), and one rate-limit
  # budget across two API replicas (C2).
  deployment:
    name: Deployment (docker compose — sections B and C)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Bind-mounted at an identical path on both sides, owned by the image's
      # uid — see the note at the top of docker-compose.yml.
      - name: Prepare the workspace root
        run: |
          sudo mkdir -p /srv/rejox-data
          sudo chown -R 10001:10001 /srv/rejox-data

      - name: Deployment gates
        env:
          REJOX_DATA_DIR: /srv/rejox-data
          REJOX_AI_PROVIDER: fake
          MIGRATE_TIMEOUT: "1800"
          # The production posture, in full: the compose deployment must stand
          # up without either refusal being waived.
          REJOX_ALLOW_UNSANDBOXED: ""
          REJOX_ALLOW_ANONYMOUS: ""
        run: |
          REJOX_DOCKER_GID="$(stat -c '%g' /var/run/docker.sock)" \
            ./verify-deployment.sh

  frontend:
    name: Frontend (types + lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # tsconfig.json covers the e2e specs too, which `npm run build` does not,
      # so a spec left referencing a renamed field is caught here rather than in
      # a Playwright run nobody triggered.
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        working-directory: frontend
        run: npm run build

  # The image has to keep building, or the deployment path rots silently while
  # every test stays green.
  docker:
    name: Backend image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
