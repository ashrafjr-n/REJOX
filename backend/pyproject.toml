[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rejox"
version = "0.1.0"
description = "Rejox — AI migration engineer: React → React Native. CLI + pipeline."
requires-python = ">=3.11"
# Proprietary — see LICENSE at the repo root. Not redistributable.
license = "LicenseRef-Proprietary"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "python-multipart==0.0.20",
    "google-genai==1.15.0",
    "typer==0.26.8",
    "rich==13.9.4",
    # Durable job queue: migrations outlive an API restart and scale across
    # worker processes (REJOX_QUEUE=rq). The `thread` backend needs neither.
    "rq==2.1.0",
    "redis==5.2.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "httpx==0.28.1"]

[project.scripts]
rejox = "app.cli:app"
rejox-worker = "app.worker:main"

[tool.setuptools.packages.find]
include = ["app*"]
