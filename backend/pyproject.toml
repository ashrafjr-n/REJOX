[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "rejox"
dynamic = ["version"]
description = "Rejox — AI migration engineer: React → React Native. CLI + pipeline."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ashraf" }]
keywords = ["react", "react-native", "migration", "codemod", "ast", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
# Functional Source License (FSL-1.1-ALv2). backend/LICENSE is a copy of the
# repo root LICENSE (a build cannot reach outside backend/); wheel-smoke.sh fails
# if they differ.
license = "FSL-1.1-ALv2"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.10,<3",
    "google-genai>=1.15.0,<2",
    "typer>=0.26.8,<1",
    "rich>=13.9.4,<14",
    # cli.py catches click's own exception types directly; typer no longer
    # declares click as a dependency, so this can't be left implicit.
    "click>=8.1,<9",
    # Pulled in by google-genai → google-auth. 49+ ships no macOS x86_64 wheels,
    # so Intel Macs would compile it from source (Rust).
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
# The web service (rejox.server): API, job queue, worker. `pip install rejox`
# alone is the CLI and never pulls these in.
server = [
    "fastapi>=0.115.6,<1",
    "uvicorn[standard]>=0.34.0,<1",
    "python-multipart>=0.0.20,<1",
    # Durable job queue: migrations outlive an API restart and scale across
    # worker processes (REJOX_QUEUE=rq). The `thread` backend needs neither.
    "rq>=2.1.0,<3",
    "redis>=5.2.1,<6",
]
dev = ["pytest>=8.3.4,<9", "httpx>=0.28.1,<1"]

[project.urls]
Homepage = "https://github.com/ashrafjr-n/REJOX"
Repository = "https://github.com/ashrafjr-n/REJOX"
Issues = "https://github.com/ashrafjr-n/REJOX/issues"
Changelog = "https://github.com/ashrafjr-n/REJOX/blob/master/backend/CHANGELOG.md"

[project.scripts]
rejox = "rejox.cli:app"
rejox-worker = "rejox.server.worker:main"

# The version comes from the nearest git tag (`v0.1.0` -> `0.1.0`), not a
# hand-maintained number — `git tag v1.2.3 && git push --tags` is the release.
# The fallback only applies to an sdist built with no `.git` (e.g. from a
# tarball); every real build here has the repo, so it never fires in practice.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
# pyproject.toml lives in backend/, not the repo root where .git actually is —
# without this, hatch-vcs looks for a repo right here, finds none, and always
# falls back silently (tag or no tag; caught by testing a real tag before
# pushing it — see v0.1.0's history).
raw-options = { root = ".." }

[tool.hatch.build.targets.wheel]
packages = ["src/rejox"]
# The worker bundles are built (hatch_build.py), not committed — gitignored
# files are left out of a build unless named as artifacts.
artifacts = ["src/rejox/_workers/*"]

[tool.hatch.build.targets.wheel.hooks.custom]

# An sdist carries the worker sources, so a wheel built from it bundles them the
# same way a checkout does (Node 20+ needed to build from source).
[tool.hatch.build.targets.sdist]
include = [
    "src/rejox",
    "scripts/bundle_workers.py",
    "hatch_build.py",
    "LICENSE",
    "parser-worker/src",
    "parser-worker/package.json",
    "parser-worker/package-lock.json",
    "parser-worker/tsconfig.json",  # esbuild reads it (strict mode)
    "codemod-worker/src",
    "codemod-worker/package.json",
    "codemod-worker/package-lock.json",
    "codemod-worker/tsconfig.json",  # esbuild reads it (strict mode)
]
exclude = ["src/rejox/_workers"]
