[pytest]
pythonpath = .
testpaths = tests
addopts = -ra
markers =
    slow: end-to-end integration tests that run npm install + tsc + Metro (deselect with '-m "not slow"').
    network: tests that reach the network (e.g. a real GitHub clone); set REJOX_RUN_NETWORK_TESTS=1 to run.
    sandbox_live: containment gates asserted against a REAL Docker daemon (section A of docs/PRE-LAUNCH-CHECKLIST.md). Skipped where no daemon answers; deselect with '-m "not sandbox_live"'.
    redis_live: the shared rate-limit gate (C2) asserted against a REAL Redis. Skipped where none answers; deselect with '-m "not redis_live"'.
