# Rejox — a reproducible deployment of the whole backend.
#
#   cp .env.example .env      # then set REJOX_API_KEYS and GEMINI_API_KEY
#   docker compose up --build
#
# Three services, and the split is the architecture:
#
#   redis    the durable queue. A migration outlives an API restart because the
#            job is here, not in a thread inside the API process.
#   api      accepts uploads, analyses, plans, enqueues. Never runs a migration.
#   worker   runs migrations. Scale with `docker compose up --scale worker=3`.
#
# The worker mounts the host Docker socket so the Validator can start a
# throw-away sibling container per stage (REJOX_SANDBOX=docker). That mount is
# the trade being made: it gives the worker control of the host's Docker daemon,
# which is why the worker runs nothing but queued migrations and why the sandbox
# containers themselves are capability-less, non-root, and network-denied except
# during install. Read docs/SECURITY.md before deploying this.
#
# It also dictates how the workspace is mounted. A sandbox container is a
# SIBLING, started by the host's daemon, so the `-v {run dir}:/work` the worker
# asks for is resolved against the HOST's filesystem — not the worker's. The
# workspace root is therefore bind-mounted at an IDENTICAL path on both sides
# (REJOX_DATA_DIR), so the two agree. A named volume would not: the daemon would
# quietly create an empty directory of that name and every stage would validate
# nothing while reporting success. The sandbox proves the mount before it runs
# anything, so a mistake here fails loudly — but it is still a mistake.
#
#   sudo mkdir -p /srv/rejox-data && sudo chown -R 10001:10001 /srv/rejox-data
#   echo 'REJOX_DATA_DIR=/srv/rejox-data' >> .env
#
# 10001 is the `rejox` uid in backend/Dockerfile — the containers run as it.

name: rejox

x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  environment: &backend-env
    REJOX_QUEUE: rq
    REJOX_REDIS_URL: redis://redis:6379/0
    # Rate-limit counters in Redis, not in each API process. Without this the
    # ceiling is per container, so two API replicas mean twice the configured
    # limit — silently. See gate C2 in docs/PRE-LAUNCH-CHECKLIST.md.
    REJOX_RATE_STORE: redis
    # Under REJOX_DATA_DIR, so this path means the same thing to the worker and
    # to the host daemon that mounts it into a sandbox container.
    REJOX_WORKSPACE_ROOT: ${REJOX_DATA_DIR:?set REJOX_DATA_DIR in .env — see the note at the top of this file}/workspaces
    REJOX_AI_CACHE: ${REJOX_DATA_DIR}/rejox-ai-cache.sqlite3
    # Real containment for the uploaded project's toolchain. Without this the
    # API and the worker both refuse to run migrations at all.
    REJOX_SANDBOX: docker
    REJOX_SANDBOX_IMAGE: ${REJOX_SANDBOX_IMAGE:-node:20-bookworm-slim}
    REJOX_SANDBOX_MEMORY: ${REJOX_SANDBOX_MEMORY:-4g}
    REJOX_SANDBOX_CPUS: ${REJOX_SANDBOX_CPUS:-2}
    REJOX_API_KEYS: ${REJOX_API_KEYS:?set REJOX_API_KEYS in .env — the API refuses to serve without keys}
    REJOX_CORS_ORIGINS: ${REJOX_CORS_ORIGINS:-http://localhost:5173}
    REJOX_RUN_TTL_SECONDS: ${REJOX_RUN_TTL_SECONDS:-86400}
    # How a job whose worker died stops looking alive: the executing process
    # stamps job.json on this beat, and a reader turns a `running` job that has
    # missed the grace into a terminal WorkerLost failure. Forwarded because the
    # right grace is a property of the host's load, not of the code. See B6.
    REJOX_JOB_HEARTBEAT: ${REJOX_JOB_HEARTBEAT:-10}
    REJOX_JOB_HEARTBEAT_GRACE: ${REJOX_JOB_HEARTBEAT_GRACE:-60}
    REJOX_AI_PROVIDER: ${REJOX_AI_PROVIDER:-gemini}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  volumes:
    # The API writes uploads here and the worker reads them: one workspace,
    # shared, or a worker could not see the job it was handed. Same path on
    # both sides of the colon — see the note at the top of this file.
    - ${REJOX_DATA_DIR}:${REJOX_DATA_DIR}
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    # Queued jobs must survive a Redis restart, so persistence is on.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    <<: *backend
    ports:
      - "${REJOX_PORT:-8000}:8000"
    # Retention is owned by the API process (one sweeper, not one per worker).
    environment:
      <<: *backend-env
      REJOX_RETENTION: "on"

  worker:
    <<: *backend
    command: ["rejox-worker"]
    environment:
      <<: *backend-env
      # Only the API sweeps; N workers sweeping the same directory would race.
      REJOX_RETENTION: "off"
    volumes:
      - ${REJOX_DATA_DIR}:${REJOX_DATA_DIR}
      # The worker starts sandbox containers for the Validator's stages.
      - /var/run/docker.sock:/var/run/docker.sock
    # The socket is mode 0660, owned by root and the host's docker group, while
    # the image runs as the non-root `rejox` uid — so without this the worker
    # gets "permission denied while trying to connect to the docker API" and
    # every migration fails at the first stage. Granting the group is the way
    # to reach the socket while staying non-root; running the worker as root
    # would be strictly worse for no gain.
    #
    #   Linux:          stat -c '%g' /var/run/docker.sock   (usually the `docker` group)
    #   Docker Desktop: 0                                   (the socket is root:root)
    group_add:
      - "${REJOX_DOCKER_GID:?set REJOX_DOCKER_GID in .env — the gid that owns /var/run/docker.sock}"
    # No ports: a worker is reached through the queue, never over HTTP.

volumes:
  redis-data:
